name: Frontend CI

on:
  push:
    branches:
      - deploy
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches:
      - deploy
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate frontend files
        run: |
          test -f frontend/index.html
          test -f frontend/app.js
          test -f frontend/Dockerfile

      - name: Build frontend image
        run: docker build -t tienda-frontend:ci ./frontend

      - name: Confirm key frontend text
        run: |
          grep -q "Tienda de Alimentos para Perritos" frontend/index.html
          grep -q "Patatas" frontend/index.html
