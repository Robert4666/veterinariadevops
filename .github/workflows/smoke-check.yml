name: Smoke Check

on:
  workflow_dispatch:
  push:
    branches:
      - deploy

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Verify frontend and backend on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.BACKEND_SSH_KEY }}
          script: |
            cd /home/ec2-user/veterinariadevops
            sudo docker compose ps
            curl -fs http://localhost:3001/api/health
            curl -fs http://localhost:3001/api/productos >/dev/null
            curl -fs http://localhost:8080 >/dev/null
            echo "Smoke check OK"
