apiVersion: apps/v1
kind: Deployment
metadata:
  name: tienda-backend
  namespace: tienda
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tienda-backend
  template:
    metadata:
      labels:
        app: tienda-backend
    spec:
      containers:
        - name: backend
          image: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/tienda-backend:eks-v1
          ports:
            - containerPort: 3001
          env:
            - name: DB_HOST
              value: tienda-db
            - name: DB_USER
              value: root
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tienda-db-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: DB_NAME
              value: tienda_perritos
            - name: DB_PORT
              value: "3306"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
